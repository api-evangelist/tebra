aid: tebra
name: Tebra
review:
  question: Does Tebra expose a documented public WebSocket API?
  answer: false
  date: '2026-07-10'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Neither of Tebra's documented API
    surfaces uses a server-push or streaming transport. The Tebra SOAP
    Practice Management API (formerly the Kareo Integration API) is
    request/response SOAP over HTTPS, and Tebra explicitly does not push data
    to external systems - integrators poll retrieval operations on a 5-15
    minute cadence. The Tebra Clinical Data API is request/response REST over
    HTTPS. There is no WebSocket (ws:// or wss://) or Server-Sent Events (SSE)
    transport on either API to model.
findings:
  summary: |
    Tebra does not publish a documented public WebSocket API. Tebra (formerly
    Kareo + PatientPop) exposes two documented API surfaces, both
    request/response over HTTPS. (1) The Tebra SOAP Practice Management API -
    the former Kareo Integration API - is served at
    https://webservice.kareo.com/services/soap/2.1/KareoServices.svc (WSDL
    available at ?wsdl). It is SOAP over HTTPS, authenticated with a customer
    key plus username and password, and is administrator gated: a practice
    System Administrator must generate the customer key and grant permissions.
    Tebra states it does not push data out to external systems, so integrators
    poll (recommended every 5-15 minutes). (2) The Tebra Clinical Data API is a
    REST patient-access API under https://api.tebra.com/clinical/v1/api,
    authenticated with an API Key in the X-Api-Key header generated by the
    patient in the Tebra Patient Portal. No realtime, bidirectional, or
    streaming WebSocket endpoint is documented on either surface.
  accessModel: |
    The SOAP Practice Management API is partner / administrator gated, not
    self-serve: a customer key must be generated by a System Administrator and
    third-party integrators are onboarded through Tebra. The Clinical Data API
    is a patient-access API - the patient self-generates an API Key from the
    Patient Portal to read their own USCDI clinical data at no charge (ONC /
    21st Century Cures Act information-blocking compliance).
  transports:
    - protocol: SOAP
      scheme: https
      baseURL: https://webservice.kareo.com/services/soap/2.1
      documented: true
      note: Practice Management API (formerly Kareo). WSDL at KareoServices.svc?wsdl. Customer key + username + password auth.
    - protocol: REST
      scheme: https
      baseURL: https://api.tebra.com/clinical/v1/api
      documented: true
      note: Clinical Data / patient-access API. X-Api-Key header auth. Read-only USCDI resources.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented on any Tebra API surface as of the review date.
    - protocol: SSE
      scheme: https
      documented: false
      note: No Server-Sent Events streaming is documented. Tebra does not push data out; integrators poll.
