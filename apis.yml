  humanURL: https://helpme.tebra.com/Tebra_PM/12_API_and_Integration
  baseURL: https://webservice.kareo.com/services/soap/2.1
  properties:
  - url: https://helpme.tebra.com/Tebra_PM/12_API_and_Integration
    type: Documentation
  - url: https://webservice.kareo.com/services/soap/2.1/KareoServices.svc?wsdl
    type: WSDL
  description: >-
    SOAP reference-data operations - GetProviders, GetPractices,
    GetServiceLocations, and GetProcedureCodes - used to resolve the providers,
    practices, locations, and procedure codes referenced by patients,
    appointments, and charges. Operation names confirmed from the live WSDL.
- aid: tebra:tebra-billing-claims-api
  name: Tebra Billing and Claims API
  tags:
  - Billing
  - Claims
  - Charges
  - Payments
  - SOAP
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://helpme.tebra.com/Tebra_PM/12_API_and_Integration
  baseURL: https://webservice.kareo.com/services/soap/2.1
  properties:
  - url: https://helpme.tebra.com/Tebra_PM/12_API_and_Integration
    type: Documentation
  - url: https://webservice.kareo.com/services/soap/2.1/KareoServices.svc?wsdl
    type: WSDL
  description: >-
    SOAP revenue-cycle operations covering charges, encounters, payments, and
    transactions - GetCharges, GetEncounterDetails, CreateEncounter,
    UpdateEncounterStatus, GetPayments, CreatePayment, and GetTransactions. This
    is the billing and claims surface of the former Kareo Integration API.
    Operation names confirmed from the live WSDL.
- aid: tebra:tebra-documents-api
  name: Tebra Documents API
  tags:
  - Documents
  - Attachments
  - SOAP
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://helpme.tebra.com/Tebra_PM/12_API_and_Integration
  baseURL: https://webservice.kareo.com/services/soap/2.1
  properties:
  - url: https://helpme.tebra.com/Tebra_PM/12_API_and_Integration
    type: Documentation
  - url: https://webservice.kareo.com/services/soap/2.1/KareoServices.svc?wsdl
    type: WSDL
  description: >-
    SOAP operations for attaching and removing documents on practice records -
    CreateDocument and DeleteDocument - along with external-vendor utilities
    GetExternalVendors, RegisterExternalVendor, GetCustomerIdFromKey, and
    GetThrottles. Operation names confirmed from the live WSDL.
- aid: tebra:tebra-clinical-data-api
  name: Tebra Clinical Data API
  tags:
  - Clinical
  - USCDI
  - Patient Access
  - REST
  - MACRA
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.tebra.com/macra
  baseURL: https://api.tebra.com/clinical/v1/api
  properties:
  - url: https://www.tebra.com/macra
    type: Documentation
  - url: https://www.tebra.com/wp-content/uploads/2023/10/General_API_Documentation-Tebra.pdf
    type: APIReference
  - url: openapi/tebra-clinical-openapi.yml
    type: OpenAPI
  - url: collections/tebra-clinical.postman_collection.json
    type: PostmanCollection
  description: >-
    REST patient-access API (ONC / 21st Century Cures Act) exposing USCDI
    clinical data for a single authenticated patient - conditions, medications,
    allergies, immunizations, vital signs, procedures, encounters, care plans,
    goals, devices, diagnostic reports, smoking status, and a binary clinical
    summary. Authenticated with an API Key in the X-Api-Key header, generated by
    the patient in the Tebra Patient Portal. Resource paths and auth confirmed
    from Tebra documentation; request parameters and response schemas modeled.
