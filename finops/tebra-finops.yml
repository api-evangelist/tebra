description: >-
  FinOps view of Tebra API spend. Tebra (formerly Kareo + PatientPop) does not
  bill its APIs on a metered, usage-based basis. The SOAP Practice Management API
  is a capability of a Tebra platform subscription, which is quote-based and
  priced per provider per month by module (EHR, practice management, billing,
  growth); the dominant, controllable cost is therefore the seat/provider count
  and module mix rather than API call volume. Payment processing fees and certain
  integrations (for example e-prescribing / PDMP add-ons) are billed separately.
  The Clinical Data (patient-access) API is provided at no cost to patients under
  federal information-blocking rules and carries no line-item charge.
notes: >-
  Because API access is bundled into the platform subscription, model Tebra cost
  around provider seats and enabled modules, not per-request pricing. Reconcile
  actual rates and any partner onboarding fees with Tebra sales. Payment
  processing (reported approx. 2.75% + $0.30 card-present, 3.25% + $0.30
  card-not-present) is a separate charge category from software subscription.
