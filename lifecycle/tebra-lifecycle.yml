- name: Tebra Clinical Data API (REST, X-Api-Key)
  status: unclear - documented host unreachable
  version: '1.0'
  spec_basis: >-
    Custom REST/JSON surface, USCDI-aligned but not formally FHIR; described
    as a "Tebra public Application Programming Interface" in the API Terms of
    Use.
  first_documented: '2023-10'
  evidence: >-
    "API User Guide, Version 1.0" cover/copyright reads "© 2023 Tebra
    Technologies, Inc." The documented production host
    (https://api.tebra.com/clinical/v1/api) - stated verbatim in the request
    URLs on pages 13-17 of that PDF - returns NXDOMAIN on the system resolver
    and on 8.8.8.8/1.1.1.1 as probed on 2026-08-14. Tebra has not published a
    formal retirement notice for this surface; its absence from DNS, next to a
    functioning FHIR API covering an overlapping USCDI resource set published
    18 months later (May 2025), is consistent with (but not confirmed as) a
    quiet migration from the 2023 REST Clinical Data API to the FHIR API.
