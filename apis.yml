apis:
- aid: tebra:tebra-patients-api
  name: Tebra Patients API
  tags:
  - Patients
  - Demographics
  - SOAP
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://helpme.tebra.com/Tebra_PM/12_API_and_Integration
  baseURL: https://webservice.kareo.com/services/soap/2.1
  properties:
  - url: https://helpme.tebra.com/Tebra_PM/12_API_and_Integration
    type: Documentation
  - url: https://webservice.kareo.com/services/soap/2.1/KareoServices.svc?wsdl
    type: WSDL
  description: >-
    SOAP operations for patient records - GetPatient, GetPatients, GetAllPatients,
    CreatePatient, UpdatePatient, UpdatePatientsExternalID, and
    UpdatePrimaryPatientCase. Part of the former Kareo Integration API. Access is
    administrator gated - a practice System Administrator generates a customer key
    and grants permissions. Operation names confirmed from the live WSDL.
- aid: tebra:tebra-appointments-api
  name: Tebra Appointments API
  tags:
  - Appointments
  - Scheduling
  - SOAP
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://helpme.tebra.com/Tebra_PM/12_API_and_Integration
  baseURL: https://webservice.kareo.com/services/soap/2.1
  properties:
  - url: https://helpme.tebra.com/Tebra_PM/12_API_and_Integration
    type: Documentation
  - url: https://webservice.kareo.com/services/soap/2.1/KareoServices.svc?wsdl
    type: WSDL
  description: >-
    SOAP operations for scheduling - GetAppointment, GetAppointments,
    CreateAppointment, UpdateAppointment, UpdateAppointmentStatus,
    DeleteAppointment, plus GetAppointmentReasons and CreateAppointmentReason.
    Tebra does not push updates, so integrators poll (recommended every 5-15
    minutes). Operation names confirmed from the live WSDL.
