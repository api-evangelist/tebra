  spec_basis: HL7 FHIR R4 / US Core Implementation Guide STU3 Release 3.1.1
  first_documented: '2025-05'
  evidence: >-
    "API User Guide, Version 1.0" cover page states "Updated: May 2025".
    Live-probed 2026-08-14: 401 on unauthenticated resource GET, 302 on
