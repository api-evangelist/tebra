    host documented in Tebra's own "General API Documentation" (Oct 2023) PDF and matches this spec's
    servers[], but as of 2026-08-14 it returns NXDOMAIN on public DNS resolvers (8.8.8.8, 1.1.1.1, system
    resolver) - the documented host no longer resolves. See lifecycle/ for detail; Tebra's newer FHIR
    API (tebra:tebra-fhir-api) covers most of the same USCDI resource set and is live.
