    type: Documentation
  - url: https://webservice.kareo.com/services/soap/2.1/KareoServices.svc?wsdl
    type: WSDL
  description: >-
    SOAP operations for patient records - GetPatient, GetPatients, GetAllPatients, CreatePatient, UpdatePatient,
    UpdatePatientsExternalID, and UpdatePrimaryPatientCase. Part of the former Kareo Integration API.
    Access is administrator gated - a practice System Administrator generates a customer key and grants
    permissions. Operation names confirmed from the live WSDL.
