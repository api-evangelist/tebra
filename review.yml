  endpointsModeled: |
    SOAP operation names are confirmed from the live WSDL. REST clinical
    resource paths and X-Api-Key auth are confirmed from Tebra's General API
    Documentation. The request query parameters and response schemas in
    openapi/tebra-clinical-openapi.yml are modeled to reflect typical USCDI /
    FHIR-flavored patient-access payloads and should be verified against current
    Tebra documentation before production use.
sources:
  - url: https://helpme.tebra.com/Tebra_PM/12_API_and_Integration
    type: Documentation
    note: Get Started - Tebra SOAP APIs. Retrieval and creation operations, customer key auth, no push (poll 5-15 min).
  - url: https://webservice.kareo.com/services/soap/2.1/KareoServices.svc?wsdl
    type: WSDL
    note: Live SOAP 2.1 WSDL (HTTP 200). All operation names confirmed here.
  - url: https://www.tebra.com/wp-content/uploads/2023/10/General_API_Documentation-Tebra.pdf
    type: APIReference
    note: Clinical Data API - REST resource paths, X-Api-Key header, 401 on invalid key, HTTPS/TLS, connection-frequency fair-use.
  - url: https://www.tebra.com/macra
    type: Documentation
    note: MACRA / ONC patient-access API landing page referenced in the API terms.
  - url: https://kareocustomertraining.s3.amazonaws.com/Help%20Center/Guides/Kareo_IntegrationAPI_TechnicalGuide.pdf
    type: Documentation
    note: Legacy Kareo Integration API Technical Guide (now redirects to the current Tebra SOAP guide).
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or SSE transport exists on either Tebra API surface. Both the
    SOAP Practice Management API and the REST Clinical Data API are
    request/response over HTTPS, and Tebra explicitly does not push data to
    external systems (integrators poll). No AsyncAPI document was created
    because there is no server-push or streaming transport on Tebra's own APIs
    to model.
