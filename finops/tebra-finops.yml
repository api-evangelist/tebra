serviceCategory: Healthcare Practice Management and EHR
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
meters:
- name: provider_seats
  description: Provider seats on the Tebra platform subscription that grants API access; the primary cost driver.
  unit: providers
  aggregation: sum
  dimensions:
  - account
  - module
- name: enabled_modules
  description: Modules enabled (EHR, practice management, billing, growth) that determine subscription price.
  unit: modules
  aggregation: sum
  dimensions:
  - account
- name: payment_processing
  description: Card payment processing fees charged on collected patient payments, separate from subscription.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track provider seat count and enabled modules; API usage itself is not separately invoiced but drives operational value.
- name: Allocation
  description: Map provider seats and modules to practices / cost centers; separate software subscription from payment-processing fees.
- name: Optimization
  description: Right-size provider seats and modules to actual need; batch and cache SOAP polling (5-15 min) to avoid unnecessary integration compute rather than to reduce a per-call fee.
- name: Accountability
  description: Assign an owner for the Tebra subscription and any partner integration agreement; review module mix and payment-processing rates periodically.
