name: Tebra
kind: company
description: >-
  Tebra is a healthcare technology company providing an all-in-one operating
  system for independent medical practices - EHR, practice management, medical
  billing, patient engagement, and practice growth. Tebra was formed from the
  2021 merger of Kareo (practice management and billing) and PatientPop
  (practice growth), and its developer surface reflects that lineage. Three
  documented API surfaces exist. The Tebra SOAP Practice Management API - the
  former Kareo Integration API, still served at webservice.kareo.com - covers
  patients, appointments, providers, practices, charges, encounters, payments,
  and transactions, and is partner / administrator gated. The Tebra Clinical
  Data API is a REST patient-access API documented under tebra.com/macra (ONC /
  21st Century Cures Act) with an API Key the patient generates from the Tebra
  Patient Portal; its documented host (api.tebra.com) no longer resolves in DNS
  as of this review. Tebra has since published a SMART on FHIR API (R4, US Core
  STU3 3.1.1, USCDI v1) at fhir.prd.cloud.tebra.com, built on the SmileCDR
  platform, offering no-charge patient read (GET) access to USCDI clinical
  resources over 2-legged or 3-legged OAuth 2.0.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
