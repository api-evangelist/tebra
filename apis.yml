- aid: tebra:tebra-fhir-api
  name: Tebra FHIR API
  description: >-
    SMART on FHIR (HL7 FHIR R4) patient-access API built on US Core
    Implementation Guide STU3 Release 3.1.1, satisfying USCDI v1 / ONC 21st
    Century Cures Act information-blocking requirements. Hosted on the SmileCDR
    FHIR platform under a Tebra/SmileCDR partnership. Confirmed live (401 on
    unauthenticated GET, 302 on /smartauth/oauth/authorize, probed 2026-08-14)
    covering Patient, AllergyIntolerance, CarePlan, CareTeam, Condition,
    DiagnosticReport, DocumentReference, Encounter, Goal, Immunization, Device
    (implantable), Observation (vitals/labs/smoking status), Location,
    Medication, MedicationRequest, Organization, Practitioner,
    PractitionerRole, Procedure, and Provenance - each Search + Read. No fee or
    contract is required for patient-facing read (GET) access to USCDIv1 data;
    clinician-focused and bulk-export backend applications require practice
    onboarding and additional fees.
  humanURL: https://www.tebra.com/macra
  baseURL: https://fhir.prd.cloud.tebra.com/fhir-request
  tags:
  - Clinical
  - FHIR
  - SMART on FHIR
  - USCDI
